# configs/baselines.yaml — Named baseline method metrics for comparison.
#
# Each entry is a named defense configuration (or lack thereof).
# Values are expected metrics from the literature / our own ablation runs.
# null = metric not measured for that baseline.
#
# Consumed by BenchmarkReporter.compare_baseline(baseline_name).

baselines:

