[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-fl"
version = "0.1.0"
description = "Federated Backdoor Immune System — IEEE GSC26 Challenge 1, Team 010"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Team 010" }]

# Phase 0 core deps (no torch/flwr — keeps install fast for proof-of-concept)
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
# Phase 1 heavy ML deps (enable once PyTorch path is active)
phase1 = [
    "torch>=2.2",
    "torchvision>=0.17",
    "flwr>=1.8",
    "pandas>=2.2",
]

[project.scripts]
sentinel-demo = "scripts.run_demo:main"

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "backend*"]
exclude = ["tests*", "scripts*"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by formatter
    "N803",   # argument name lowercase (numpy uses N, X, y)
    "N806",   # variable in function lowercase (same)
    "N802",   # function name lowercase — test helpers use uppercase X, _random_X etc.
    "N812",   # lowercase import as non-lowercase (PyTorch uses F = functional)
    "RUF001", # ambiguous unicode in string — intentional (arrows in comments)
    "RUF002", # ambiguous unicode in docstring — intentional
    "RUF003", # ambiguous unicode in comment — intentional (x in math notation)
    "RUF005", # list concat — readable in test fixtures
    "RUF012", # mutable class default — intentional for name/layer class-level str attrs
    "RUF022", # unsorted __all__ — grouped by category intentionally
    "RUF043", # regex metacharacters in pytest.raises match= — intentional patterns
    "RUF059", # unused unpacked variable — standard pattern in test tuple unpack
    "B017",   # blind Exception in pytest.raises — intentional for schema validator tests
    "B905",   # zip without strict — intentional in test helpers
    "C408",   # dict() call — readable default-kwargs pattern
    "E402",   # module level import not at top (scripts use sys.path setup)
    "N818",   # exception name suffix
]

[tool.ruff.lint.isort]
known-first-party = ["ai", "backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "unit: fast, isolated tests",
    "integration: end-to-end pipeline tests (slower)",
    "regression: fixed-seed reproducibility tests",
    "benchmark: full ablation matrix (slowest, run manually)",
    "slow: tests that run actual Flower FL rounds (opt-in with -m slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ai", "backend"]
omit = ["*/tests/*", "*/scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
