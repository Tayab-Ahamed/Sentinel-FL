name: Phase 1 · PyTorch and Flower

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-tests:
    name: PyTorch and Flower tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Phase 1 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,phase1]"
      - name: Run PyTorch and Flower tests
        run: |
          pytest -q \
            tests/test_asr_evaluator.py \
            tests/test_mnist_cnn.py \
            tests/test_flower_client.py \
            tests/test_flower_simulation.py \
            tests/test_torch_remediation.py
