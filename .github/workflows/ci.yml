name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,phase1]"
      - name: Compile source
        run: python -m compileall -q ai backend scripts
      - name: Run core test suite
        run: pytest -m "not benchmark and not slow" --cov=ai --cov=backend --cov-report=term-missing
        env:
          SENTINEL_LOG_LEVEL: WARNING
          SENTINEL_DATASET_PHASE: phase0_synthetic
          SENTINEL_SEED: "42"

  integration:
    name: Integration and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev,phase1]"
      - name: Verify installation
        run: python scripts/verify_install.py
      - name: Run deterministic demos
        run: |
          python scripts/run_demo.py
          python scripts/run_remediation_demo.py
      - name: Run adaptive security smoke matrix
        run: python scripts/run_red_team_matrix.py --quick
      - name: Verify FastAPI health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app

          response = TestClient(app).get("/api/health")
          assert response.status_code == 200
          assert response.json()["status"] == "ok"
          print("FastAPI health check passed")
          PY
      - name: Verify release invariants
        run: python scripts/verify_release.py --skip-demos
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-fl-ci-evidence
          path: |
            experiments/demo_results.json
            experiments/remediation_results.json
            experiments/attestation_chain.jsonl
            experiments/red_team/
            experiments/release_evidence.json

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.8.6"
      - name: Report lint and formatting differences
        run: |
          ruff check ai backend scripts tests --output-format=github
          ruff format --check ai backend scripts tests
