name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format check  (ruff)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Unit + Integration tests (Python 3.11 and 3.12)
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev + Phase 1 deps
        run: |
          pip install --upgrade pip
          # The collected suite includes PyTorch, Flower, and matplotlib tests.
          pip install -e ".[dev,phase1]"

      - name: Run unit + integration tests
        run: |
          pytest -m "not benchmark and not slow" --cov=ai --cov=backend --cov-report=term-missing
        env:
          SENTINEL_LOG_LEVEL: WARNING
          SENTINEL_DATASET_PHASE: phase0_synthetic
          SENTINEL_SEED: "42"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage

  # ---------------------------------------------------------------------------
  # Installation verifier
  # ---------------------------------------------------------------------------
  verify-install:
    name: Verify install
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run install verifier
        run: python scripts/verify_install.py
        env:
          SENTINEL_LOG_LEVEL: WARNING

  # ---------------------------------------------------------------------------
  # Integration smoke test — run_demo.py must exit 0
  # ---------------------------------------------------------------------------
  demo:
    name: Integration — run_demo.py
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Phase 0 demo
        run: python scripts/run_demo.py
        env:
          SENTINEL_LOG_LEVEL: WARNING

      - name: Verify demo_results.json was produced
        run: |
          python -c "
          import json, pathlib
          data = json.loads(pathlib.Path('experiments/demo_results.json').read_text())
          print('demo OK, strategies:', list(data.keys()))
          assert 'fedavg' in data
          assert 'multikrum' in data
          assert 'multikrum+guard' in data
          asr_fedavg = data['fedavg']['attack_success_rate']
          asr_krum   = data['multikrum']['attack_success_rate']
          assert asr_fedavg > 0.5, f'Expected high FedAvg ASR, got {asr_fedavg}'
          assert asr_krum   < 0.5, f'Expected low Krum ASR, got {asr_krum}'
          print(f'FedAvg ASR={asr_fedavg:.3f}  Krum ASR={asr_krum:.3f}  — sanity OK')
          "

      - name: Upload demo results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-results
          path: experiments/demo_results.json

  # ---------------------------------------------------------------------------
  # FastAPI import + health check
  # ---------------------------------------------------------------------------
  api-import:
    name: Backend import check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project deps
        run: pip install -e ".[dev]"

      - name: Verify FastAPI app imports cleanly
        run: python -c "from backend.main import app; print('FastAPI app loaded:', app.title)"

      - name: Verify health endpoint via TestClient
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          client = TestClient(app)
          resp = client.get('/api/health')
          assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
          body = resp.json()
          assert body['status'] == 'ok', f'Unexpected status: {body}'
          print('Health check OK:', body)
          "

  # ---------------------------------------------------------------------------
  # Adaptive security gate — multiple attacker powers, not one cherry-picked run
  # ---------------------------------------------------------------------------
  red-team:
    name: Security — adaptive red-team matrix
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Phase 0 + report dependencies
        run: pip install -e ".[dev]"

      - name: Run 8-scenario adaptive threat matrix
        run: python scripts/run_red_team_matrix.py --quick

      - name: Verify all remediations passed
        run: |
          python -c "
          import json, pathlib
          p = pathlib.Path('experiments/red_team/red_team_results.json')
          data = json.loads(p.read_text())
          s = data['summary']
          assert s['scenario_count'] == 8
          assert s['remediation_acceptance_rate'] == 1.0
          assert s['remediation_asr']['worst'] <= 0.10
          print('Adaptive security gate OK:', s)
          "

      - name: Upload red-team evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-red-team-evidence
          path: experiments/red_team/

  release-evidence:
    name: Release evidence verifier
    runs-on: ubuntu-latest
    needs: [demo, red-team, api-import]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: pip install -e ".[dev]"
      - name: Verify release invariants
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: experiments/release_evidence.json
